name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          URL="https://vzqjirjvoqcxetcaggan.supabase.co/rest/v1/doctors?select=id&limit=1"
          KEY="sb_publishable_7CtOW0T6vfnGhsw78SJIWw_43ERPQpA"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$URL")
          echo "Supabase responded: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Keep-alive ping failed (HTTP $code)"
            exit 1
          fi
          echo "Keep-alive OK — project is awake."
